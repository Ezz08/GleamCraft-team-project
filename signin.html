
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" href="img/icons8-dental-care-100.png" type="image/x-icon">

    <title>Sign In</title>
</head>

<body>

    <div class="parent-login">

        <form class="form">

            <h1>Welcome Back</h1>

            <div class="form-1">

                <label for="email">Email address</label>
                <input type="email" placeholder="Enter your email" id="email" required>

                <label for="password">Password</label>
                <input type="password" placeholder="Enter your password" id="password" required>

            </div>

            <button class="signup" type="submit">Sign In</button>

            <div class="center">

                <div class="or">
                    <p>OR</p>
                </div>

                <div class="signin">

                    <div class="google">
                        <img src="img/icons8-google-48.png" alt="Google">
                        <p>Sign in with Google</p>
                    </div>

                    <div class="apple">
                        <img src="img/icons8-apple-50.png" alt="Apple">
                        <p>Sign in with Apple</p>
                    </div>

                </div>

                <div class="ques">
                    <p>Don't have an account?</p>
                    <a href="login.html">Sign Up</a>
                </div>

            </div>

        </form>

        <div class="big-image">
            <img src="img/filip-rankovic-grobgaard-joILn6p_oeM-unsplash.jpg" alt="Dental Care">
        </div>

    </div>

    <script src="js/signin.js"></script>

</body>

</html>
