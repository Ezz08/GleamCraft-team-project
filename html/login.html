<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" href="../img/icons8-dental-care-100.png" type="image/x-icon">
    <title>Sign Up</title>
</head>

<body>
    <div class="parent-login">
        <form class="form">
            <h1>Get Started Now</h1>
            <div class="form-1">
                <label for="name">Name</label>
                <input type="text" placeholder="Enter your name" id="name" required>

                <label for="email">Email address</label>
                <input type="email" placeholder="Enter your email" id="email" required>

                <label for="password">Password</label>
                <input type="password" placeholder="Enter your password" id="password" required>

                <div class="terms">
                    <input type="checkbox" id="check" required>
                    <label for="check">I agree to the terms & policy</label>
                </div>

            </div>
            <button class="signup" type="submit">Sign Up</button>

            <div class="center">
                <div class="or">
                    <p>OR</p>
                </div>

                <div class="signin">
                    <div class="google">
                        <img src="../img/icons8-google-48.png">
                        <p>Sign in with Google</p>
                    </div>

                    <div class="apple">
                        <img src="../img/icons8-apple-50.png">
                        <p>Sign in with Apple</p>
                    </div>
                </div>

                <div class="ques">
                    <p>Have an account?</p>
                    <a href="signin.html">Sign In</a>
                </div>

            </div>
        </form>

        <div class="big-image">
            <img src="../img/filip-rankovic-grobgaard-joILn6p_oeM-unsplash.jpg">
        </div>
    </div>


</body>

</html>
